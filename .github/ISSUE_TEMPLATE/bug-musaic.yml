name: Bug — Musaic Studio
description: Something in Musaic Studio does not work the way it should.
labels: ["bug", "app: musaic"]
body:
  - type: markdown
    attributes:
      value: |
        Issues here are public. Do not paste account details or anything
        you would not put on a web page — write to musaic@likwest.com instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The short version first, then the detail.
      placeholder: The export finished but the second layer had no sound.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to get there
      description: |
        The steps you took, in order. This is the part that decides whether
        a bug can be fixed — a report that cannot be reproduced usually
        cannot be fixed either.
      placeholder: |
        1. New project, 16:9
        2. Record a first layer with the built-in mic
        3. Record a second layer with a USB interface
        4. Export at 1080p
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About. Please give the exact number.
      placeholder: "1.4.2"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and iOS version
      placeholder: iPhone 15 Pro, iOS 26.2
    validations:
      required: true
  - type: input
    id: audio
    attributes:
      label: Audio hardware, if any
      description: Interface, mic or headphones in use. Leave empty for the built-in mic.
      placeholder: Steinberg UR12 over the Lightning camera adapter
  - type: textarea
    id: extra
    attributes:
      label: Screenshot, screen recording or anything else
      description: Drag files straight into this box.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I looked through the open issues and this is not one of them.
          required: true
        - label: There is nothing private in what I wrote above.
          required: true
